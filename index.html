<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="format-detection" content="telephone=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Activos ME"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;background:#fff}img{max-width:100%}[hidden]{display:none!important}</style><title>Levantamiento de Activos ME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna para celular en campo, misma identidad que la Inspección Master Easement. Tema claro fijo (fondo blanco). */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --surface:#f7f7f0;
  --line:#e3e3d4;
  --ink:#2f2f0e;
  --muted:#6b6b52;
  --olive:#9a9a54;
  --olive-dark:#6f6f33;
  --olive-soft:#eeeedd;
  --exc:#2d5f2a; --exc-bg:#e2eedf;
  --ok:#3f7a3a; --ok-bg:#e7f1e3;
  --bad:#a46a12; --bad-bg:#fbefd9;
  --urg:#b3261e; --urg-bg:#fbe4e1;
  --des:#4a4a40; --des-bg:#e9e9e4;
  --pd:#7a6200; --pd-bg:#fbf1c7; --pd-line:#d9bd45;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-wrap:anywhere}
button,label,.chip,.est{touch-action:manipulation}
/* iPhone: 16px mínimo en campos para que no haga zoom al escribir */
input,textarea,select{font-size:16px!important}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 150px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.tnum{font-variant-numeric:tabular-nums}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:12px;min-height:56px}
.top-in img{height:26px;width:auto}
.top-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--olive-dark);font-weight:600;padding:8px 4px}

/* Inicio */
.home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding-top:28px}
.home>img{width:min(280px,80%)}
.home h1{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.1}
.stack{display:flex;flex-direction:column;gap:12px;width:100%}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:var(--r);border:1px solid var(--olive-dark);background:var(--olive-dark);color:#fff;font-weight:600;font-size:17px;padding:12px 16px;text-align:center}
.btn.sec{background:var(--bg);color:var(--olive-dark)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:500;min-height:44px;font-size:15px}
.btn.danger{background:var(--urg);border-color:var(--urg)}
.btn.small{min-height:44px;font-size:15px}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.panel{width:100%;text-align:left;background:var(--olive-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--olive);border-radius:99px;transition:width .3s}
.stats{width:100%;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r)}
.stats div{padding:12px 4px;display:flex;flex-direction:column;gap:2px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-size:22px}
.stats span{font-size:12px;color:var(--muted)}
.tools{width:100%;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:12px}
.tool{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;text-align:left;color:var(--ink);position:relative}
.tool:last-child{border-bottom:0}
.tool span{display:flex;flex-direction:column;gap:2px;min-width:0}
.tool small{color:var(--muted);font-size:13px}
.tool b{font-weight:600}
.tool input{position:absolute;inset:0;opacity:0;cursor:pointer}
.chev{color:var(--olive-dark);font-size:20px;flex:none}

/* Formularios */
label.f,.f{display:flex;flex-direction:column;gap:6px;text-align:left}
.lbl{font-weight:600}
.lbl .req-mark{color:var(--urg)}
.hint{font-size:13px;color:var(--muted);font-weight:400}
input[type=text],input[type=date],input[type=number],textarea{font:inherit;width:100%;max-width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none;min-height:48px}
/* iPhone dibuja la fecha con su propio ancho; se fuerza al ancho del campo */
input[type=date]{display:block;text-align:left;line-height:1.3}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=checkbox]{-webkit-appearance:auto;appearance:auto;flex:none}
textarea{min-height:76px;resize:vertical}
.err{font-size:13px;color:var(--urg);font-weight:600}
.f.bad .lbl{color:var(--urg)}
.f.bad input[type=text],.f.bad textarea{border-color:var(--urg)}

/* Tarjetas de lugares */
.sites{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scard{text-align:left;min-height:110px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.scard strong{font-size:17px;line-height:1.2}
.scard small{color:var(--muted);font-size:13px}
.scard.prog{border:2px solid var(--olive);padding:11px}
.scard.done{background:var(--olive-soft);border-color:var(--olive)}
.scard.new{border:1.5px dashed var(--olive);background:var(--bg);color:var(--olive-dark);justify-content:center}
.scard.new strong{font-size:18px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:99px;padding:3px 10px;width:fit-content;white-space:nowrap}
.pill.exc{background:var(--exc-bg);color:var(--exc)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.urg{background:var(--urg-bg);color:var(--urg)}
.pill.des{background:var(--des-bg);color:var(--des)}
.pill.pd{background:var(--pd-bg);color:var(--pd)}
.pill.na{background:#eeeeee;color:#6b6b6b}
.pill.prog{background:var(--olive-soft);color:var(--olive-dark)}
.pill.fin{background:var(--olive);color:#fff}

/* Lugar */
.site-head{display:flex;flex-direction:column;gap:6px;padding-block:6px 14px}
.site-head h2{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.acard{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);display:flex;gap:12px;padding:10px;align-items:stretch}
.acard .th{flex:none;width:68px;height:68px;border-radius:8px;background:var(--surface);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:11px}
.acard .th img{width:100%;height:100%;object-fit:cover;display:block}
.acard .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.acard .id{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.acard .desc{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.acard .sub{font-size:13px;color:var(--muted)}
.acard .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acard .acts{display:flex;gap:14px}
.acard .acts button{border:0;background:none;color:var(--olive-dark);font-weight:600;font-size:14px;padding:4px 0}
.empty{text-align:center;padding:36px 12px;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:6px}
.empty b{color:var(--ink);font-size:17px}
.locked{display:flex;gap:10px;align-items:center;background:var(--olive-soft);border-radius:var(--r);padding:12px 14px;font-weight:600;color:var(--olive-dark);margin-bottom:12px}

/* Formulario de activo */
.step{display:flex;flex-direction:column;gap:18px;padding-block:20px;border-bottom:1px solid var(--line)}
.step:last-of-type{border-bottom:0}
.step>h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive-dark)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;max-width:100%;white-space:normal;border:1px solid var(--line);border-radius:22px;padding:8px 14px;background:var(--bg);color:var(--ink);font-weight:500;font-size:15px;line-height:1.2;text-align:left}
.chip[aria-pressed=true]{background:var(--olive-dark);color:#fff;border-color:var(--olive-dark)}
.chip.alt{border-style:dashed;color:var(--muted)}
.chip.alt[aria-pressed=true]{background:var(--olive-dark);color:#fff;border-style:solid}
.chip.pd{border-style:dashed;border-color:var(--pd-line);color:var(--pd)}
.chip.pd[aria-pressed=true]{background:var(--pd-bg);color:var(--pd);border-style:solid;border-color:var(--pd-line);font-weight:600}
.estados{display:flex;flex-direction:column;gap:8px}
.est{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);padding:10px 12px;min-height:52px}
.est i{flex:none;width:14px;height:14px;border-radius:50%}
.est span{display:flex;flex-direction:column;min-width:0}
.est small{color:var(--muted);font-size:13px}
.est[aria-pressed=true]{border-width:2px;padding:9px 11px}
.est[aria-pressed=true] small{color:inherit;opacity:.85}
.est.exc i{background:var(--exc)} .est.exc[aria-pressed=true]{background:var(--exc-bg);border-color:var(--exc);color:var(--exc)}
.est.ok i{background:var(--ok)} .est.ok[aria-pressed=true]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.est.bad i{background:var(--bad)} .est.bad[aria-pressed=true]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.est.urg i{background:var(--urg)} .est.urg[aria-pressed=true]{background:var(--urg-bg);border-color:var(--urg);color:var(--urg)}
.est.des i{background:var(--des)} .est.des[aria-pressed=true]{background:var(--des-bg);border-color:var(--des);color:var(--des)}
.est.pd i{background:var(--pd-line)} .est.pd{border-style:dashed;border-color:var(--pd-line)} .est.pd[aria-pressed=true]{background:var(--pd-bg);border-style:solid;color:var(--pd)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:24px;color:var(--olive-dark);flex:none}
.stepper input{text-align:center;font-size:20px;font-weight:600;max-width:110px}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.toggle input{width:22px;height:22px;accent-color:var(--olive-dark)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phslot{display:flex;flex-direction:column;gap:6px}
.phslot .lbl{font-size:15px}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.addph{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:10px;border:1.5px dashed var(--olive);background:var(--olive-soft);color:var(--olive-dark);font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:6px}
.addph.bad{border-color:var(--urg);color:var(--urg);background:var(--urg-bg)}
.addph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.addph b{font-size:26px;line-height:1}
.note{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}

/* Barra inferior fija */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot-in{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;flex-direction:column;gap:8px}
.foot-note{font-size:14px;color:var(--muted);text-align:center}
.confirm{background:var(--olive-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm.red{background:var(--urg-bg)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.row2 .btn{font-size:16px;line-height:1.2;padding-inline:10px}
/* Mientras se escribe, la barra inferior deja de flotar y pasa al final de la página:
   no tapa el campo sobre el teclado (Android) y sigue al alcance bajando un poco */
body.typing .foot{position:static;border-top:0}
body.typing #app{padding-bottom:8px!important}
/* Celulares angostos (iPhone SE, Android pequeños) */
@media (max-width:360px){
  .wrap,.top-in,.foot-in{padding-inline:12px}
  .home h1{font-size:30px}
  .site-head h2{font-size:26px}
  .stats b{font-size:19px}
  .stats span{font-size:11px}
  .scard{padding:10px;min-height:100px}
  .scard.prog{padding:9px}
  .scard strong{font-size:16px}
  .chip{padding:8px 12px;font-size:14px}
  .row2 .btn{font-size:15px}
  .acard .th{width:56px;height:56px}
}
/* Teléfono horizontal: barra inferior más baja */
@media (max-height:480px) and (orientation:landscape){
  .btn{min-height:44px}
  .foot-in{padding-block:8px}
}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.seal{width:64px;height:64px;border-radius:50%;background:var(--olive);color:#fff;display:grid;place-items:center;font-size:32px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body><header class="top" id="top" hidden>
  <div class="top-in">
    <button class="back" id="backBtn" type="button">‹ Atrás</button>
    <div class="top-title" id="topTitle"></div>
    <img id="topLogo" alt="Hacienda Pinilla">
  </div>
</header>
<main class="wrap" id="app"><p class="muted" style="text-align:center;padding-top:40px">Cargando…</p></main>
<div class="foot" id="foot" hidden><div class="foot-in" id="footIn"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* =========================================================
   LUGARES DEL LEVANTAMIENTO
   No hay lugares predefinidos: se escriben en el formulario y se guardan
   en el celular (S.listaLugares). "cod" son las iniciales que forman el ID
   del activo: Playa Langosta → ME-PL-001
   ========================================================= */
let LUGARES = [];
// Solo para pasar datos guardados con la versión anterior (lugares fijos)
const LUGARES_ANTERIORES = {langosta:["Playa Langosta","PL"], rodera:["Rodera","RD"], bonita:["Playa Bonita","PB"], avellanas:["Playa Avellanas","PA"]};

/* ===================== Catálogo (del formulario de Microsoft Forms) ===================== */
const CATEGORIAS = {
  "Mobiliario interior": ["Silletería y bancas","Mesas, barras y escritorios","Tapicería y sofás","Muebles de almacenamiento (estantes, armarios)"],
  "Mobiliario exterior": ["Madera tratada","Aluminio / metal","Ratán sintético / fibras","Sombrillas, toldos y lonas","Plástico / polipropileno"],
  "Infraestructura / obra civil": ["Decks y pasarelas","Pérgolas y gazebos","Cercas, barandas y portones","Pisos","Aceras","Adoquines","Muros","Muros de contención","Paredes","Puentes","Techos","Aleros y cubiertas"],
  "Iluminación y sistema eléctrico": ["Luces de senderos","Luminarias de postes","Iluminación ornamental","Cajas de breakers","Tomas exteriores","Plafones","Tableros"],
  "Equipamiento y maquinaria": ["Bombas y motores de agua","Riego automatizado","Aire acondicionado","Plantas eléctricas","Transformadores","Pararrayos","Línea blanca y refrigeración comercial"],
  "Señalización": ["Rótulos informativos","Rótulos viales","Basureros y reciclaje"],
  "Amenidades": ["Baños de playa","Duchas de playa","Lavapiés","Extintores"],
  "Paisajismo y áreas verdes": ["Sistema de riego","Coberturas vivas y césped","Árboles","Jardineras y vegetación arbustiva","Obras de contención para áreas verdes","Drenaje superficial","Canales verdes"]
};
const ESTADOS = [
  {v:"Excelente",     cls:"exc", d:"Prácticamente nuevo, sin marcas de deterioro"},
  {v:"Bueno",         cls:"ok",  d:"Operativo, desgaste leve propio del ambiente"},
  {v:"Regular",       cls:"bad", d:"Requiere mantenimiento preventivo"},
  {v:"Crítico",       cls:"urg", d:"Dañado, inoperativo o representa un riesgo"},
  {v:"Para descarte", cls:"des", d:"Vida útil cumplida, no reparable"}
];
const FACTORES = ["Ninguno / en perfecto estado","Salinidad","Corrosión","Óxido","Exposición solar","Decoloración","Daño UV","Humedad excesiva","Hongos","Pudrición","Termitas","Comején","Plagas","Desgaste mecánico"];
const ACCIONES = ["Ninguna (monitoreo regular)","Mantenimiento menor / pintura / barniz","Reparación correctiva","Reemplazo programado","Retiro urgente / desecho"];
const ACCION_SUGERIDA = {"Excelente":0,"Bueno":0,"Regular":1,"Crítico":2,"Para descarte":4};
const PD = "Por definir";

/* ===================== Almacenamiento (en el celular) ===================== */
const DB = (() => {
  let dbp = null; const mem = {};
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try{
        const r = indexedDB.open("levantamiento-activos-me", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      }catch(e){ res(null); }
    });
    return dbp;
  }
  async function get(k){
    const db = await open(); if(!db) return mem[k];
    return new Promise(res => { try{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(mem[k]); }catch(e){res(mem[k]);} });
  }
  async function set(k,v){
    mem[k]=v; const db = await open(); if(!db) return;
    return new Promise(res => { try{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>res(); }catch(e){res();} });
  }
  async function del(k){
    delete mem[k]; const db = await open(); if(!db) return;
    return new Promise(res => { try{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete=()=>res(); t.onerror=()=>res(); }catch(e){res();} });
  }
  async function keys(){
    const db = await open(); if(!db) return Object.keys(mem);
    return new Promise(res => { try{ const q=db.transaction("kv").objectStore("kv").getAllKeys(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res(Object.keys(mem)); }catch(e){res(Object.keys(mem));} });
  }
  async function clear(){
    for (const k of Object.keys(mem)) delete mem[k];
    const db = await open(); if(!db) return;
    return new Promise(res => { try{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").clear(); t.oncomplete=()=>res(); t.onerror=()=>res(); }catch(e){res();} });
  }
  return {get,set,del,keys,clear};
})();

// Datos de la versión con lugares fijos: se conservan los lugares que ya tenían trabajo
function migrar(st){
  if(!st.lugares) st.lugares = {};
  if(!Array.isArray(st.listaLugares)){
    st.listaLugares = [];
    for(const [id,d] of Object.entries(st.lugares)){
      if(d.estado==="pendiente" && !(d.activos||[]).length){ delete st.lugares[id]; continue; }
      const a = LUGARES_ANTERIORES[id] || [id, id.slice(0,2).toUpperCase()];
      st.listaLugares.push({id, nombre:a[0], cod:a[1]});
    }
    st.v = 2;
  }
  return st;
}
function usarEstado(st){ S = migrar(st); LUGARES = S.listaLugares; }
// Iniciales del nombre para el ID: "Playa Langosta" → PL, "Rodera" → RO
function codigoLugar(nombre){
  const base = nombre.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g," ");
  const pal = base.split(/\s+/).filter(p => p && !["DE","DEL","LA","EL","LOS","LAS","Y"].includes(p));
  let cod = pal.length>1 ? pal.slice(0,3).map(p=>p[0]).join("") : (pal[0]||"LG").slice(0,2);
  let final = cod, n = 2;
  while(LUGARES.some(l => l.cod===final)) final = cod + (n++);
  return final;
}
const normal = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
function lugarParecido(nombre){
  const n = normal(nombre); if(!n) return null;
  return LUGARES.find(l => { const m = normal(l.nombre); return m===n || m.includes(n) || n.includes(m); }) || null;
}

/* Fotos: se guardan dos versiones, una completa (1280 px) y una miniatura (320 px) */
function procesarFoto(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const out = size => { const k = Math.min(1, size/Math.max(img.width,img.height)); const c=document.createElement("canvas");
        c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        return c.toDataURL("image/jpeg", size>400?0.72:0.7); };
      const r = {full:out(1280), thumb:out(320)}; URL.revokeObjectURL(url); res(r);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

/* Descargas: claude.ai → compartir en celular → descarga normal */
async function entregarArchivo(blob, nombre, titulo){
  let hecho=false;
  if(window.claude && window.claude.use){
    try{ const dl=await window.claude.use("downloads");
      if(dl){ try{ await dl.save({filename:nombre,data:blob}); toast("Archivo listo"); hecho=true; }
        catch(err){ hecho=true; if(err&&err.code==="declined") toast("Descarga cancelada"); else if(err&&err.code==="rate_limited") toast("Espera un momento e intenta de nuevo"); else hecho=false; } } }catch(e){}
  }
  // El menú de Compartir solo en celulares y tabletas; en computadora (Mac o Windows) se descarga directo
  const esCelular = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  if(!hecho && esCelular && navigator.canShare){
    try{ const file=new File([blob],nombre,{type:blob.type});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:titulo}); hecho=true; } }
    catch(e){ if(e&&e.name==="AbortError") hecho=true; }
  }
  if(!hecho){ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000); toast("Archivo descargado"); }
}

/* ===================== Formulario de activo ===================== */
// Cada grupo guarda: sel (opción elegida, "__otro" o PD) y otro (texto libre)
function grupoDesde(valor, opciones){
  if(valor===undefined || valor===null || valor==="") return {sel:null, otro:""};
  if(valor===PD) return {sel:PD, otro:""};
  if(opciones.includes(valor)) return {sel:valor, otro:""};
  return {sel:"__otro", otro:valor};
}
function multiDesde(arr){
  const sel=[], otros=[];
  (arr||[]).forEach(v => { if(v===PD || FACTORES.includes(v)) sel.push(v); else otros.push(v); });
  if(otros.length) sel.push("__otro");
  return {sel, otro:otros.join(", ")};
}
async function abrirActivo(lugarId, activoId, duplicar){
  const d=L(lugarId); const base = activoId ? d.activos.find(a=>a.id===activoId) : (d.activos[d.activos.length-1] || null);
  const nuevo = !activoId || duplicar;
  F = {
    lugar:lugarId, editId: nuevo?null:activoId,
    ubicacion: base?base.ubicacion:"",
    categoria: grupoDesde(base&&base.categoria, Object.keys(CATEGORIAS)),
    subcategoria: {sel:null, otro:""},
    sinCodigo:false, codigo:"",
    descripcion:"", cantidad:1,
    estado: grupoDesde(null, ESTADOS.map(e=>e.v)),
    factores: {sel:[], otro:""},
    accion: grupoDesde(null, ACCIONES), accionManual:false,
    obs:"", foto1:null, foto2:null, errores:{}, confirmBorrar:false,
    heredado: !activoId && !!base
  };
  F.subcategoria = grupoDesde(base&&base.subcategoria, subOpciones());
  if(activoId){ // editar o duplicar: copia todo
    Object.assign(F, {
      descripcion: base.descripcion, cantidad: base.cantidad,
      estado: grupoDesde(base.estado, ESTADOS.map(e=>e.v)),
      factores: multiDesde(base.factores),
      accion: grupoDesde(base.accion, ACCIONES), accionManual:true,
      obs: base.obs||""
    });
    if(!duplicar){
      F.sinCodigo = base.codigo===SC; F.codigo = base.codigo===SC?"":base.codigo;
      if(base.foto1) F.foto1 = await DB.get(`f:${base.id}:1`) || null;
      if(base.foto2) F.foto2 = await DB.get(`f:${base.id}:2`) || null;
    } else {
      F.sinCodigo = base.codigo===SC;
    }
  }
  V={name:"activo", lugar:lugarId, dup:duplicar}; UI={}; window.scrollTo(0,0); render();
}
function subOpciones(){ const c=F.categoria.sel; return CATEGORIAS[c] || []; }
const valorGrupo = g => g.sel==="__otro" ? g.otro.trim() : (g.sel||"");
function valorMulti(g){ const v=g.sel.filter(x=>x!=="__otro"); if(g.sel.includes("__otro")) g.otro.split(",").map(s=>s.trim()).filter(Boolean).forEach(s=>v.push(s)); return v; }

function chips(nombre, opciones, g, multi){
  const on = v => multi ? g.sel.includes(v) : g.sel===v;
  const otroOn = on("__otro");
  return `<div class="chips" role="group">
    ${opciones.map((o,i)=>`<button type="button" class="chip" data-g="${nombre}" data-i="${i}" aria-pressed="${on(o)}">${esc(o)}</button>`).join("")}
    <button type="button" class="chip alt" data-g="${nombre}" data-i="otro" aria-pressed="${otroOn}">Otro…</button>
    <button type="button" class="chip pd" data-g="${nombre}" data-i="pd" aria-pressed="${on(PD)}">Por definir</button>
  </div>
  ${otroOn?`<input type="text" data-otro="${nombre}" value="${esc(g.otro)}" placeholder="${multi?"Escribe cuál (separa con comas)":"Escribe cuál"}">`:""}`;
}
function campo(clave, etiqueta, inner, hint){
  const e=F.errores[clave];
  return `<div class="f ${e?"bad":""}" id="c-${clave}"><span class="lbl">${etiqueta} <span class="req-mark">*</span></span>${hint?`<span class="hint">${hint}</span>`:""}${inner}${e?`<span class="err">${e}</span>`:""}</div>`;
}
function slotFoto(n, titulo, sub, requerida){
  const f=F["foto"+n], e=F.errores["foto"+n];
  return `<div class="phslot" id="c-foto${n}">
    <span class="lbl">${titulo}${requerida?` <span class="req-mark">*</span>`:` <span class="hint">(opcional)</span>`}</span>
    ${f?`<div class="ph"><img src="${f.thumb}" alt="${titulo}"><button type="button" data-qf="${n}" aria-label="Quitar foto">×</button></div>`
       :`<label class="addph ${e?"bad":""}"><b>+</b>${sub}<input type="file" accept="image/*" data-foto="${n}"></label>`}
    ${e?`<span class="err">${e}</span>`:""}
  </div>`;
}

  const l=lugarCfg(F.lugar), d=L(F.lugar);
  $("#topTitle").textContent = F.editId ? `Editar ${F.editId}` : (V.dup ? "Duplicar activo" : `Nuevo activo · ${l.nombre}`);
  const subs=subOpciones();
  const est=valorGrupo(F.estado);
  const detReq=pideDetalle(est);
  app.innerHTML = `
  ${F.heredado?`<p class="note" style="margin-top:12px">La ubicación y la categoría vienen del activo anterior. Cámbialos si este es distinto.</p>`:""}
  ${V.dup?`<p class="note" style="margin-top:12px">Copia del activo. Revisa el estado, escribe la placa y toma las fotos de este.</p>`:""}
  <section class="step">
    <h3>Paso 1 · Ubicación</h3>
    <label class="f ${F.errores.ubicacion?"bad":""}" id="c-ubicacion"><span class="lbl">Ubicación específica <span class="req-mark">*</span></span>
      <span class="hint">Ej. entrada al sendero, frente al rancho, margen del lago</span>
      <input type="text" id="fUbic" value="${esc(F.ubicacion)}">${F.errores.ubicacion?`<span class="err">${F.errores.ubicacion}</span>`:""}</label>
  </section>
  <section class="step">
    <h3>Paso 2 · Identificación</h3>
    ${campo("categoria","Categoría", chips("categoria", Object.keys(CATEGORIAS), F.categoria))}
    ${F.categoria.sel ? campo("subcategoria", F.categoria.sel==="Mobiliario exterior"?"Subcategoría (material)":"Subcategoría", chips("subcategoria", subs, F.subcategoria)) : ""}
    <div class="f ${F.errores.codigo?"bad":""}" id="c-codigo"><span class="lbl">Código o placa <span class="req-mark">*</span></span>
      ${F.sinCodigo?"":`<input type="text" id="fCod" value="${esc(F.codigo)}" placeholder="Número de la placa" autocapitalize="characters">`}

function rerender(){ const y=window.scrollY; render(); window.scrollTo(0,y); }

function elegir(grupo, i){
  const opts = {categoria:Object.keys(CATEGORIAS), subcategoria:subOpciones(), estado:ESTADOS.map(e=>e.v), factores:FACTORES, accion:ACCIONES}[grupo];
  const v = i==="otro" ? "__otro" : i==="pd" ? PD : opts[+i];
  const g = F[grupo];
  if(grupo==="factores"){
    const ninguno=FACTORES[0];
    if(g.sel.includes(v)) g.sel=g.sel.filter(x=>x!==v);
    else if(v===ninguno || v===PD) g.sel=[v];
    else g.sel=g.sel.filter(x=>x!==ninguno && x!==PD).concat(v);
  } else {
    g.sel = g.sel===v && v!=="__otro" ? null : v;
  }
  if(grupo==="categoria") F.subcategoria = {sel: (g.sel==="__otro"||g.sel===PD)?g.sel:null, otro:""};
  if(grupo==="accion") F.accionManual=true;
  if(grupo==="estado" && !F.accionManual){ const k=ACCION_SUGERIDA[g.sel]; F.accion = k===undefined?{sel:null,otro:""}:{sel:ACCIONES[k],otro:""}; }
  if(grupo==="estado" && (g.sel==="Excelente") && !F.factores.sel.length) F.factores={sel:[FACTORES[0]],otro:""};
  delete F.errores[grupo];
  rerender();
  if(v==="__otro"){ const inp=document.querySelector(`[data-otro="${grupo}"]`); if(inp) inp.focus(); }
}

function validar(){
  const e={}; const falta="Falta completar"; const otro="Escribe cuál es";
  const chk=(k,g)=>{ if(!g.sel) e[k]=falta; else if(g.sel==="__otro" && !g.otro.trim()) e[k]=otro; };
  if(!F.ubicacion.trim()) e.ubicacion=falta;
  chk("categoria",F.categoria);
  if(F.categoria.sel) chk("subcategoria",F.subcategoria);
  if(!F.sinCodigo && !F.codigo.trim()) e.codigo="Escribe la placa o marca “No tiene placa visible”";
  if(!F.descripcion.trim()) e.descripcion=falta;
  const q=parseInt(F.cantidad); if(!(q>=1)) e.cantidad="Debe ser 1 o más";
  chk("estado",F.estado);
  if(!F.factores.sel.length) e.factores="Marca al menos uno (o “Ninguno”)"; else if(F.factores.sel.includes("__otro") && !F.factores.otro.trim()) e.factores=otro;
  chk("accion",F.accion);
  if(!F.foto1) e.foto1="Toma la foto general";
  if(pideDetalle(valorGrupo(F.estado)) && !F.foto2) e.foto2="Con este estado se necesita foto del detalle";
  return e;
}
async function guardarActivo(otroIgual){
  F.errores=validar();
  const claves=Object.keys(F.errores);
  if(claves.length){ rerender(); const el=document.getElementById("c-"+claves[0]); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); toast(`Faltan ${claves.length} campo${claves.length===1?"":"s"} por completar`); return; }
  const d=L(F.lugar), l=lugarCfg(F.lugar);
  let id=F.editId;
  if(!id){ d.seq=(d.seq||0)+1; id=`ME-${l.cod}-${String(d.seq).padStart(3,"0")}`; }
  const a = {
    id, ubicacion:F.ubicacion.trim(),
    categoria:valorGrupo(F.categoria), subcategoria:valorGrupo(F.subcategoria),
    codigo:F.sinCodigo?SC:F.codigo.trim(), descripcion:F.descripcion.trim(),
    cantidad:F.sinCodigo?parseInt(F.cantidad):1,
    estado:valorGrupo(F.estado), factores:valorMulti(F.factores), accion:valorGrupo(F.accion),
    obs:F.obs.trim(), foto1:!!F.foto1, foto2:!!F.foto2, registrado:new Date().toISOString()
  };
  for(const n of [1,2]){ const k=`f:${id}:${n}`; if(F["foto"+n]){ await DB.set(k,F["foto"+n]); TH[k]=F["foto"+n].thumb; } else { await DB.del(k); TH[k]=null; } }
  const i=d.activos.findIndex(x=>x.id===id);
  if(i>=0) d.activos[i]=a; else d.activos.push(a);
  await guardar();
  if(otroIgual){ toast(`${id} guardado. Registra el siguiente`); await abrirActivo(F.lugar, id, true); }
  else { toast(`${id} guardado`); ir({name:"lugar", id:F.lugar}); }
}

const colLetra = n => { let s=""; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s; };
async function exportarExcel(parcial, btn){
  if(!window.ExcelJS){ toast("No se pudo cargar el generador de Excel. Revisa la señal y recarga."); return; }
  const txt=btn.innerHTML; btn.disabled=true; btn.innerHTML="Generando Excel…";
  try{
    const wb=new ExcelJS.Workbook(); wb.creator="Levantamiento de activos · Master Easement";
    const ws=wb.addWorksheet("Activos",{views:[{state:"frozen",xSplit:1,ySplit:1}]});
    ws.columns = COLS.map(c=>({header:c.h, width:c.w}));
    const head=ws.getRow(1); head.height=32;
    head.eachCell((c,i)=>{ const seg=COLS[i-1].seg;
      c.font={bold:true,color:{argb:"FFFFFFFF"},name:"Calibri",size:11};
      c.fill={type:"pattern",pattern:"solid",fgColor:{argb:seg?"FF9A9A54":"FF6F6F33"}};
      c.alignment={vertical:"middle",horizontal:"center",wrapText:true};
      c.border={bottom:{style:"thin",color:{argb:"FF2F2F0E"}}};
    });
    let r=2;
    for(const l of LUGARES){
      const d=L(l.id);
      for(const a of d.activos){
        const row=ws.getRow(r);
        row.values=[a.id,l.nombre,a.ubicacion,a.categoria,a.subcategoria,a.codigo,a.descripcion,+a.cantidad,a.estado,(a.factores||[]).join(", "),a.accion,a.obs,"","",d.responsable,d.fecha?new Date(d.fecha+"T12:00:00"):null];
        row.getCell(16).numFmt="dd/mm/yyyy";
        row.alignment={vertical:"middle",wrapText:true};
        row.getCell(8).alignment={vertical:"middle",horizontal:"center"};
        let conFoto=false;
        for(const n of [1,2]){
          if(!a["foto"+n]) continue;
          const f=await DB.get(`f:${a.id}:${n}`); if(!f) continue;
          const img=wb.addImage({base64:f.thumb, extension:"jpeg"});
          ws.addImage(img,{tl:{col:11+n+0.08,row:r-1+0.08},ext:{width:96,height:72},editAs:"oneCell"});
          conFoto=true;
        }
        row.height = conFoto ? 62 : 30;
        r++;
      }
    }
    const ultima=Math.max(r-1,1), hasta=Math.max(ultima+500,1000);
    // Listas desplegables para que el encargado agregue activos a mano con los mismos valores
    const lista = arr => ['"'+arr.join(",")+'"'];
    const listas = {
      4: lista(Object.keys(CATEGORIAS).concat(PD)),
      9: lista(ESTADOS.map(e=>e.v).concat(PD)),
      11: lista(ACCIONES.concat(PD)),
      17: lista(["Alta","Media","Baja"]),
      20: lista(["Pendiente","En proceso","Resuelto","No aplica"])
    };
    for(let i=2;i<=hasta;i++) for(const [c,f] of Object.entries(listas))
      ws.getCell(i,+c).dataValidation={type:"list",allowBlank:true,formulae:f,showErrorMessage:false};
    // Colores por estado, también para filas nuevas
    const fill=(bg,fg)=>({fill:{type:"pattern",pattern:"solid",bgColor:{argb:bg}},font:{color:{argb:fg},bold:true}});
    ws.addConditionalFormatting({ref:`I2:I${hasta}`,rules:[
      {type:"containsText",operator:"containsText",text:"Excelente",priority:1,style:fill("FFE2EEDF","FF2D5F2A")},
      {type:"containsText",operator:"containsText",text:"Bueno",priority:2,style:fill("FFE7F1E3","FF3F7A3A")},
      {type:"containsText",operator:"containsText",text:"Regular",priority:3,style:fill("FFFBEFD9","FFA46A12")},
      {type:"containsText",operator:"containsText",text:"Crítico",priority:4,style:fill("FFFBE4E1","FFB3261E")},
      {type:"containsText",operator:"containsText",text:"descarte",priority:5,style:fill("FFE9E9E4","FF4A4A40")}
    ]});
    ws.addConditionalFormatting({ref:`B2:K${hasta}`,rules:[
      {type:"containsText",operator:"containsText",text:PD,priority:6,style:fill("FFFBF1C7","FF7A6200")}
    ]});
    ws.addConditionalFormatting({ref:`T2:T${hasta}`,rules:[
      {type:"containsText",operator:"containsText",text:"Resuelto",priority:7,style:fill("FFE7F1E3","FF3F7A3A")},
      {type:"containsText",operator:"containsText",text:"En proceso",priority:8,style:fill("FFFBEFD9","FFA46A12")}
    ]});
    ws.autoFilter={from:"A1",to:`${colLetra(COLS.length)}1`};
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    await entregarArchivo(blob, `Activos_MasterEasement_${parcial?"AVANCE_":""}${hoy()}.xlsx`, "Activos Master Easement");
  }catch(e){ console.error(e); toast("No se pudo generar el Excel. Intenta de nuevo."); }
  finally{ btn.disabled=false; btn.innerHTML=txt; }
}

/* ===================== Reporte en Word por lugar ===================== */
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MES3=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function fechaLarga(f){ if(!f) return ""; const d=new Date(f+"T12:00:00"); const s=`${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; return s[0].toUpperCase()+s.slice(1); }
function bytesDe(u){ const b=atob(u.split(",")[1]); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
function cargarImg(u){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=u; }); }
// Foto lista para Word: máximo 1100 px y ajustada a la caja sin deformarla
async function fotoWord(u, maxW, maxH){
  const img=await cargarImg(u);
  const k=Math.min(1, 1100/Math.max(img.width,img.height));
  const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const r=Math.min(maxW/c.width, maxH/c.height);
  return {data:bytesDe(c.toDataURL("image/jpeg",0.8)), w:Math.round(c.width*r), h:Math.round(c.height*r)};
}
const COLOR_ESTADO={exc:["E2EEDF","2D5F2A"],ok:["E7F1E3","3F7A3A"],bad:["FBEFD9","A46A12"],urg:["FBE4E1","B3261E"],des:["E9E9E4","4A4A40"],pd:["FBF1C7","7A6200"],na:["EEEEEE","555555"]};

async function exportarWord(lugarId, btn){
  if(!window.docx){ toast("No se pudo cargar el generador de Word. Revisa la señal y recarga."); return; }
  const l=lugarCfg(lugarId), d=L(lugarId);
  if(!d.activos.length){ toast("Este lugar todavía no tiene activos"); return; }
  const txt=btn.innerHTML; btn.disabled=true; btn.innerHTML="Generando Word…";
  try{
    const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,ShadingType,AlignmentType,ImageRun,BorderStyle,VerticalAlign,Footer,PageNumber,HeightRule,TableLayoutType}=docx;
    const FONT="Arial", TINTA="2F2F0E", OLIVA="6F6F33", SUAVE="EEEEDD", GRIS="6B6B52";
    const W=9972, C=[1800,3186,1800,3186];           // carta, márgenes de 2 cm
    const L1=C[0]+C[1], L3=C[1]+C[2]+C[3];
    const linea={style:BorderStyle.SINGLE,size:4,color:"C9C9B4"};
    const bordes={top:linea,bottom:linea,left:linea,right:linea};
    const sinBorde={style:BorderStyle.NONE,size:0,color:"FFFFFF"};
    const p=(text,o={})=>new Paragraph({keepNext:o.keep!==false, alignment:o.align, spacing:{before:o.before||0,after:o.after||0},
      children:[new TextRun({text:String(text??""),bold:o.bold,color:o.color||TINTA,size:o.size||19,italics:o.italic,font:FONT})]});
    const celda=(children,w,o={})=>new TableCell({children, width:{size:w,type:WidthType.DXA}, columnSpan:o.span,
      shading:o.fill?{type:ShadingType.CLEAR,color:"auto",fill:o.fill}:undefined, verticalAlign:o.top?VerticalAlign.TOP:VerticalAlign.CENTER,
      margins:{top:70,bottom:70,left:110,right:110}, borders:o.borders||bordes});
    const etq=(t,w,keep)=>celda([p(t,{bold:true,size:17,color:"4A4A22",keep})],w,{fill:SUAVE});
    const val=(t,w,o={})=>celda([p(t===""||t==null?"—":t,{bold:o.bold,color:o.color,keep:o.keep})],w,{span:o.span,fill:o.fill});

    // Fotos (caja de 3.2 x 2.15 pulgadas a 96 ppp)
    const fotos={};
    for(const a of d.activos) for(const n of [1,2]){
      if(!a["foto"+n]) continue; const f=await DB.get(`f:${a.id}:${n}`); if(!f) continue;
      fotos[`${a.id}:${n}`]=await fotoWord(f.full, 300, 206);
    }
    const celdaFoto=(a,n,titulo)=>{
      const f=fotos[`${a.id}:${n}`];
      const img=f ? new Paragraph({keepNext:true, alignment:AlignmentType.CENTER, spacing:{before:60,after:20},
          children:[new ImageRun({type:"jpg", data:f.data, transformation:{width:f.w,height:f.h}})]})
        : p("Sin foto",{italic:true,color:"9A9A80",align:AlignmentType.CENTER,before:300,after:300});
      return celda([p(titulo,{bold:true,size:17,color:"4A4A22"}), img], L1, {span:2, top:true});
    };

    const ficha=a=>{
      const cls=clsEstado(a.estado), [bg,fg]=COLOR_ESTADO[cls]||COLOR_ESTADO.na;
      const fila=(cells,o={})=>new TableRow({children:cells, cantSplit:true, height:o.h?{value:o.h,rule:HeightRule.ATLEAST}:undefined});
      return new Table({width:{size:W,type:WidthType.DXA}, columnWidths:C, layout:TableLayoutType.FIXED, rows:[
        fila([celda([p("ID activo",{bold:true,size:17,color:"FFFFFF"})],C[0],{fill:OLIVA}), celda([p(a.id,{bold:true,color:"FFFFFF",size:20})],C[1],{fill:OLIVA}),
              celda([p("Cantidad",{bold:true,size:17,color:"FFFFFF"})],C[2],{fill:OLIVA}), celda([p(a.cantidad,{bold:true,color:"FFFFFF"})],C[3],{fill:OLIVA})]),
        fila([etq("Ubicación específica",C[0]), val(a.ubicacion,L3,{span:3})]),
        fila([etq("Categoría",C[0]), val(a.categoria,C[1]), etq("Subcategoría",C[2]), val(a.subcategoria,C[3])]),
        fila([etq("Código / placa",C[0]), val(a.codigo,C[1]), etq("Estado",C[2]), val(a.estado,C[3],{bold:true,color:fg,fill:bg})]),
        fila([etq("Descripción",C[0]), val(a.descripcion,L3,{span:3})]),
        fila([etq("Factores de deterioro",C[0]), val((a.factores||[]).join(", "),C[1]), etq("Acción sugerida",C[2]), val(a.accion,C[3])]),
        fila([celdaFoto(a,1,"Foto general"), celdaFoto(a,2,"Foto detalle")]),
        fila([etq("Observaciones",C[0],false), val(a.obs,L3,{span:3,keep:false})])
      ]});
    };

    // Encabezado del reporte
    const logo=await cargarImg(LOGO);
    const unidades=d.activos.reduce((m,a)=>m+(+a.cantidad||0),0);
    const sinB={top:sinBorde,bottom:sinBorde,left:sinBorde,right:sinBorde};
    const datoCab=(t,v,w)=>celda([p(t,{size:15,color:GRIS,bold:true}),p(v,{size:20,bold:true})],w,{borders:{top:linea,bottom:linea,left:sinBorde,right:sinBorde}});
    const cab=new Table({width:{size:W,type:WidthType.DXA}, columnWidths:[3324,3324,3324], layout:TableLayoutType.FIXED,
      rows:[new TableRow({children:[datoCab("LUGAR",l.nombre,3324), datoCab("FECHA",fechaLarga(d.fecha),3324), datoCab("RESPONSABLE",d.responsable,3324)]})]});
    // Resumen por estado: solo los estados que aparecen
    const orden=ESTADOS.map(e=>e.v).concat(PD);
    const conteo=orden.map(v=>[v,d.activos.filter(a=>a.estado===v).length]).filter(x=>x[1]);
    const otros=d.activos.filter(a=>!orden.includes(a.estado)).length; if(otros) conteo.push(["Otro",otros]);
    const wc=Math.floor(W/conteo.length), cols=conteo.map((_,i)=>i===conteo.length-1?W-wc*(conteo.length-1):wc);
    const resumen=new Table({width:{size:W,type:WidthType.DXA}, columnWidths:cols, layout:TableLayoutType.FIXED, rows:[new TableRow({children:conteo.map(([v,n],i)=>{
      const [bg,fg]=COLOR_ESTADO[v==="Otro"?"na":clsEstado(v)]||COLOR_ESTADO.na;
      return celda([p(n,{bold:true,size:26,color:fg,align:AlignmentType.CENTER}), p(v,{size:16,color:fg,align:AlignmentType.CENTER})], cols[i], {fill:bg, borders:sinB});
    })})]});

    const hijos=[
      new Paragraph({alignment:AlignmentType.CENTER, spacing:{after:120}, children:[new ImageRun({type:"png", data:bytesDe(LOGO), transformation:{width:190,height:Math.round(190*logo.height/logo.width)}})]}),
      new Paragraph({alignment:AlignmentType.CENTER, spacing:{after:40}, children:[new TextRun({text:"Evaluación del estado de conservación de activos",bold:true,size:30,color:TINTA,font:FONT})]}),
      new Paragraph({alignment:AlignmentType.CENTER, spacing:{after:240}, children:[new TextRun({text:"MASTER EASEMENT",size:18,color:OLIVA,bold:true,characterSpacing:40,font:FONT})]}),
      cab,
      new Paragraph({spacing:{before:200,after:100}, children:[new TextRun({text:`${d.activos.length} activo${d.activos.length===1?"":"s"} registrado${d.activos.length===1?"":"s"} · ${unidades} unidad${unidades===1?"":"es"}${d.estado==="completo"?"":" · Registro en curso"}`,size:18,color:GRIS,font:FONT})]}),
      resumen,
      new Paragraph({spacing:{after:280}, children:[]})
    ];
    d.activos.forEach(a=>{ hijos.push(ficha(a)); hijos.push(new Paragraph({spacing:{after:280}, children:[]})); });

    const doc=new Document({creator:"Levantamiento de activos · Master Easement", title:`Reporte ${l.nombre}`,
      styles:{default:{document:{run:{font:FONT,size:19}}}, paragraphStyles:[{id:"PieME",name:"Pie ME",run:{font:FONT,size:15,color:GRIS}}]},
      sections:[{properties:{page:{size:{width:12240,height:15840}, margin:{top:1000,bottom:1000,left:1134,right:1134,footer:500}}},
        footers:{default:new Footer({children:[new Paragraph({style:"PieME", alignment:AlignmentType.CENTER, children:[
          new TextRun({text:`Master Easement · ${l.nombre} · Página `,size:15,color:GRIS,font:FONT}),
          new TextRun({children:[PageNumber.CURRENT]}),
          new TextRun({text:" de ",size:15,color:GRIS,font:FONT}),
          new TextRun({children:[PageNumber.TOTAL_PAGES]})]})]})},
        children:hijos}]});
    const out=await Packer.toBlob(doc);
    const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    const f=new Date((d.fecha||hoy())+"T12:00:00");
    const nombreArchivo=`ME_${l.nombre.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w]+/g,"_").replace(/^_|_$/g,"")}_${f.getDate()}.${MES3[f.getMonth()]}.${f.getFullYear()}.docx`;
    await entregarArchivo(blob, nombreArchivo, `Reporte ${l.nombre}`);
  }catch(e){ console.error(e); toast("No se pudo generar el Word. Intenta de nuevo."); }
  finally{ btn.disabled=false; btn.innerHTML=txt; }
}

/* ===================== Fotos en .zip y respaldo ===================== */
async function exportarFotos(btn){
  if(!window.JSZip){ toast("No se pudo cargar el compresor. Revisa la señal y recarga."); return; }
  const txt=btn.innerHTML; btn.disabled=true; btn.innerHTML="<span><b>Preparando fotos…</b></span>";
  try{
    const zip=new JSZip(); let n=0;
    for(const l of LUGARES) for(const a of L(l.id).activos) for(const k of [1,2]){
      if(!a["foto"+k]) continue; const f=await DB.get(`f:${a.id}:${k}`); if(!f) continue;
      zip.folder(l.nombre.replace(/[\\/:*?"<>|]/g,"-")).file(`${a.id}_${k===1?"general":"detalle"}.jpg`, f.full.split(",")[1], {base64:true}); n++;
    }
    if(!n){ toast("Todavía no hay fotos"); return; }
    const blob=await zip.generateAsync({type:"blob"});
    await entregarArchivo(blob, `Fotos_Activos_MasterEasement_${hoy()}.zip`, "Fotos de activos");
  }catch(e){ toast("No se pudieron preparar las fotos."); }
  finally{ btn.disabled=false; btn.innerHTML=txt; }
}
async function exportarRespaldo(btn){
  const txt=btn.innerHTML; btn.disabled=true;
  try{
    const fotos={}; for(const k of await DB.keys()) if(String(k).startsWith("f:")) fotos[k]=await DB.get(k);
    const data={app:"levantamiento-activos-me", v:1, fecha:fmtFecha(hoy()), estado:S, fotos};
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    await entregarArchivo(blob, `Respaldo_Registro_Activos_ME_${hoy()}.json`, "Respaldo del registro");
  }catch(e){ toast("No se pudo crear la copia."); }
  finally{ btn.disabled=false; btn.innerHTML=txt; }
}
